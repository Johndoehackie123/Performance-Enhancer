# Releases Performance Enhancer whenever the version in a manifest.json is not
# yet in the published pool, then rebuilds the repository index on the pool
# branch (gh-pages by default).
#
# The pool is the only ledger: a version is "released" when
# `<id>@<version>.zip` exists there. Re-running the workflow is therefore always
# safe, and a failed run publishes nothing.

name: Release plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # bun is used because @revenge-mod/plugin-cli is installed from git and
        # its `prepare` script builds the CLI, which needs the workspace peer
        # @revenge-mod/types to be linked first. npm runs that script in
        # isolation and fails; bun links workspace packages first.
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc -p plugins/performance-enhancer/tsconfig.json --noEmit

      - name: Build and package
        run: bun run package

      - name: Verify the artifacts load on every client
        # Revenge Manager ships the stable runtime, Next loads repositories, and
        # Valenced validates the manifest before anything else runs. This fails
        # the build if either artifact stops loading, instead of shipping junk.
        run: node scripts/verify-stable.mjs

      - name: Check out the published pool
        env:
          POOL_BRANCH: ${{ vars.POOL_BRANCH || 'gh-pages' }}
          POOL_DIR: published
        run: |
          git fetch origin "${POOL_BRANCH}" || true
          if git rev-parse --verify "origin/${POOL_BRANCH}" >/dev/null 2>&1; then
            git worktree add --detach "${POOL_DIR}" "origin/${POOL_BRANCH}"
          else
            echo "Pool branch does not exist yet; creating it."
            git worktree add --detach "${POOL_DIR}" HEAD
            git -C "${POOL_DIR}" checkout --orphan "${POOL_BRANCH}"
            git -C "${POOL_DIR}" rm -rf --cached . >/dev/null 2>&1 || true
            rm -rf "${POOL_DIR:?}"/* 2>/dev/null || true
          fi
          mkdir -p "${POOL_DIR}/pool" "${POOL_DIR}/valenced"

      - name: Plan releases
        id: plan
        env:
          POOL_DIR: published
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Each client has its own artifact directory (the manifests differ),
          # so plan each independently; the combined count drives the rest.
          mkdir -p published/valenced
          env -u GITHUB_OUTPUT node scripts/plan.mjs --pool "${POOL_DIR}/pool" --dist build/dist/revenge --out "${RUNNER_TEMP}/plan.json"
          env -u GITHUB_OUTPUT node scripts/plan.mjs --pool "${POOL_DIR}/valenced" --dist build/dist/valenced --out "${RUNNER_TEMP}/plan-valenced.json"
          REVENGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/plan.json','utf8')).length)")
          VALENCED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/plan-valenced.json','utf8')).length)")
          echo "count=$((REVENGE + VALENCED))" >> "$GITHUB_OUTPUT"

      - name: Publish artifacts to the pool
        if: steps.plan.outputs.count != '0'
        env:
          POOL_DIR: published
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          node scripts/publish.mjs --plan "${RUNNER_TEMP}/plan.json" --pool "${POOL_DIR}/pool"
          node scripts/publish.mjs --plan "${RUNNER_TEMP}/plan-valenced.json" --pool "${POOL_DIR}/valenced"

      - name: Regenerate index.json
        if: steps.plan.outputs.count != '0'
        env:
          POOL_DIR: published
          POOL_BRANCH: ${{ vars.POOL_BRANCH || 'gh-pages' }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          # Set PAGES_BASE_URL to a GitHub Pages URL if Pages is enabled. The
          # default serves the same branch through raw.githubusercontent.com,
          # which needs no Pages setup and works on every repository.
          BASE="${PAGES_BASE_URL:-https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${POOL_BRANCH}}"
          BASE="${BASE%/}"
          echo "Serving the pool from ${BASE}/pool"
          bun run index -- --dist "${POOL_DIR}/pool" --base-url "${BASE}/pool" --out "${POOL_DIR}/index.json"
          node scripts/valenced-index.mjs --dist "${POOL_DIR}/valenced" --base-url "${BASE}/valenced" --out "${POOL_DIR}/valenced/index.json"

      - name: Commit the pool
        if: steps.plan.outputs.count != '0'
        env:
          POOL_DIR: published
          POOL_BRANCH: ${{ vars.POOL_BRANCH || 'gh-pages' }}
        run: |
          cd "${POOL_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool index.json valenced
          if git diff --cached --quiet; then
            echo "Pool already holds this plan."
            exit 0
          fi
          git commit -m "Publish plugin release(s)"
          git push origin HEAD:"${POOL_BRANCH}"

      - name: Create GitHub releases
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_DIR: published
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/tag.mjs --plan "${RUNNER_TEMP}/plan.json" --attach-dir build/dist/valenced

      - name: Clean up
        if: always()
        env:
          POOL_DIR: published
        run: git worktree remove --force "${POOL_DIR}" || true
